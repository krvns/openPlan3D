services:
  app:
    container_name: openplan3d
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-}
    image: openplan3d:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true

