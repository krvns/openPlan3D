services:
  app:
    container_name: openplan3d
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-}
    image: openplan3d:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      STORAGE_DIR: "/data/projects"
      PROTOCOL_HEADER: "x-forwarded-proto"
      HOST_HEADER: "x-forwarded-host"
      ORIGIN: ${ORIGIN:-https://plan.homeiknow.com}

    volumes:
      - openplan3d_data:/data
    networks:
      - proxy_net

volumes:
  openplan3d_data:

networks:
  proxy_net:
    external: true

